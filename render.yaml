# Free plan by default. Note: on the free plan the server sleeps after ~15 min idle
# and local files reset on restart, so demo deals are temporary. For data that
# survives restarts, switch `plan` to starter and uncomment the disk below.
services:
  - type: web
    name: sealed
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: .data
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_URL
        sync: false
    # disk:
    #   name: sealed-data
    #   mountPath: /var/data
    #   sizeGB: 1

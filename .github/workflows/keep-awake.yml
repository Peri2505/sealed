# Render's free plan sleeps after 15 minutes without traffic, and waking takes
# about a minute. This pings the live demo every 10 minutes so judges never
# see a cold start. (GitHub may delay scheduled runs by a few minutes.)
name: Keep demo awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://sealed-1twu.onrender.com/api/config > /dev/null
